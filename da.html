<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RG - DA Judging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <main class="app">
    <section class="page-card">
      <header class="header">
        <div class="header-left">
          <a class="mode-pill btn-blue-light" href="index.html">⬅</a>
          <span>Mode:</span>
          <button class="mode-pill active" id="mode-junior" type="button">Junior (12 DA)</button>
          <button class="mode-pill" id="mode-senior" type="button">Senior (15 DA)</button>
        </div>
        <span class="header-badge">DA1</span>
      </header>

      <div class="main-grid">
        <div class="side-column">
          <button class="btn btn-block btn-0" type="button" data-value="0.0">0.0</button>
          <button class="btn btn-block btn-02" type="button" data-value="0.2">0.2</button>
          <button class="btn btn-block btn-A" id="btn-A" type="button"><span>A</span><small>Acrobatics</small></button>
        </div>

        <section class="center-panel">
          <div class="center-header">
            <div class="center-label">Final score</div>
            <div class="center-score" id="center-score">0.00</div>
          </div>
          <p class="center-last-row">Last difficulty: <span id="last-difficulty">-</span></p>
          <div class="center-footer"><button class="btn-main" id="btn-validate" type="button">Validate</button></div>
        </section>

        <div class="side-column">
          <button class="btn btn-block btn-undo" id="btn-undo" type="button" disabled>Undo</button>
          <button class="btn btn-block btn-03" type="button" data-value="0.3">0.3</button>
          <button class="btn btn-block btn-04" type="button" data-value="0.4">0.4</button>
        </div>
      </div>

      <footer class="footer" id="footer-list"></footer>
    </section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="da-result-title">
    <section class="modal">
      <h1 class="modal-title" id="da-result-title">DA Result</h1>
      <div class="modal-row"><span>Final DA score: </span></div>
      <div class="modal-score-big" id="modal-score-big">0.00</div>
      <button class="btn-restart" id="btn-restart" type="button">Restart</button>
    </section>
  </div>

  <script src="scripts/common.js" defer></script>
  <script src="scripts/da.js" defer></script>
</body>
</html>

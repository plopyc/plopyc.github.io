<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RG – DA Judging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-title">RG – Difficulty (DA)</div>
      <div class="header-badge">
        <span>Panel</span>
        <strong>DA1</strong>
      </div>
    </header>

    <main class="main-grid">
      <!-- Left column: values / acrobatics -->
      <section class="side-column">
        <div class="card">
          <div class="card-title">Values</div>
          <div class="value-grid">
            <button class="value-btn" data-da="0.0">0.0</button>
            <button class="value-btn" data-da="0.2">0.2</button>
            <button class="value-btn" data-da="0.3">0.3</button>
            <button class="value-btn" data-da="0.4">0.4</button>
            <button class="value-btn" data-da="0.5">0.5</button>
            <button class="value-btn" data-da="0.6">0.6</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Group</div>
          <button class="btn btn-pill">A (Acrobatics)</button>
        </div>

        <div class="card">
          <div class="card-title">Actions</div>
          <button class="btn btn-danger" id="da-undo">Undo</button>
          <button class="btn" id="da-reset">Reset</button>
        </div>
      </section>

      <!-- Center panel: score -->
      <section class="center-panel">
        <div class="center-header">
          <div>
            <div class="center-label">Final score</div>
            <div id="da-score" class="center-score">0.00</div>
          </div>
          <div>
            <div class="center-label">Max DA</div>
            <div id="da-max" style="font-size:1.2rem;">0.00</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Current element</div>
          <div id="da-current">No element selected</div>
        </div>

        <div class="center-footer">
          <button class="btn" onclick="openModal('da-modal')">Insert</button>
          <button class="btn-main" id="da-send">Send</button>
        </div>
      </section>

      <!-- Right column: history -->
      <section class="side-column">
        <div class="card">
          <div class="card-title">History</div>
          <div id="da-history" class="history-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-item">Mode: Senior / Junior</div>
      <div class="footer-item">A counted · Max DA · Panel DA1</div>
    </footer>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="da-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Confirm insertion</div>
        <button class="btn btn-pill btn-danger" onclick="closeModal('da-modal')">×</button>
      </div>
      <div class="modal-body">
        Insert current DA value into the final score?
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('da-modal')">Cancel</button>
        <button class="btn-main" id="da-confirm">Insert</button>
      </div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script src="scripts/da.js"></script>
</body>
</html>

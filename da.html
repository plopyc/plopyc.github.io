<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RG – DA Judging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --accent: #38bdf8;


      --d0: #22c55e; /* 0.1 */
      --d2: #84cc16; /* 0.3 */
      --d3: #eab308; /* 0.5 */
      --d4: #f97316; /* 0.7 */
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      height: 100%;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: 1.2rem;
      padding: 2rem;
      width: 100%;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .difficulty-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .btn-difficulty {
      padding: 1.5rem 0;
      font-size: 1.6rem;
      font-weight: 600;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      color: #0b1120;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .btn-difficulty:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
    }

    .btn-undo,
    .btn-markA,
    .btn-validate {
      flex: 1;
      padding: 1.2rem;
      font-size: 1.4rem;
      font-weight: 600;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .btn-undo {
      background: #111827;
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.4);
    }

    .btn-markA {
      background: #9b59b6;
      color: white;
    }

    .btn-validate {
      background: var(--accent);
      color: #0b1120;
    }

    .btn-validate:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      background: #020617;
      border-radius: 1.2rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.9);
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
      text-transform: uppercase;
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
    }

    .modal-score-big {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-top: 1rem;
    }

    .btn-restart {
      margin-top: 2rem;
      width: 100%;
      padding: 1.2rem;
      font-size: 1.4rem;
      font-weight: 600;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      background: #111827;
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.6);
    }

    .btn-restart:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.6);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">
      <div class="title">DA – Apparatus Difficulty</div>

      <div class="difficulty-grid">
        <button class="btn-difficulty" style="background: var(--d0);" data-value="0.0">0.0</button>
        <button class="btn-difficulty" style="background: var(--d2);" data-value="0.2">0.2</button>
        <button class="btn-difficulty" style="background: var(--d3);" data-value="0.3">0.3</button>
        <button class="btn-difficulty" style="background: var(--d4);" data-value="0.4">0.4</button>
      </div>

      <div class="info-row">
        <span>Last difficulty:</span>
        <span id="last-difficulty">—</span>
      </div>

      <div class="controls">
        <button class="btn-undo" id="btn-undo" disabled>Undo</button>
        <button class="btn-markA" id="btn-markA">Mark as A</button>
        <button class="btn-validate" id="btn-validate">Validate</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal-title">DA Result</div>

      <div class="modal-row">
        <span>Total DA</span>
        <span id="modal-total">0.0</span>
      </div>

      <div class="modal-row">
        <span>Final DA score</span>
        <span id="modal-score">0.0</span>
      </div>

      <div class="modal-score-big" id="modal-score-big">0.0</div>

      <button class="btn-restart" id="btn-restart">Restart</button>
    </div>
  </div>

  <script>
    let difficulties = [];
    let aCount = 0;

    const diffButtons = document.querySelectorAll(".btn-difficulty");
    const lastDiffSpan = document.getElementById("last-difficulty");
    const undoButton = document.getElementById("btn-undo");
    const markAButton = document.getElementById("btn-markA");
    const validateButton = document.getElementById("btn-validate");

    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalTotal = document.getElementById("modal-total");
    const modalScore = document.getElementById("modal-score");
    const modalScoreBig = document.getElementById("modal-score-big");
    const restartButton = document.getElementById("btn-restart");

    function updateLastDifficulty() {
      if (difficulties.length === 0) {
        lastDiffSpan.textContent = "—";
        undoButton.disabled = true;
      } else {
        lastDiffSpan.textContent = difficulties[difficulties.length - 1].value.toFixed(1);
        undoButton.disabled = false;
      }
    }

    function addDifficulty(value) {
      let finalValue = value;

      if (difficulties.length >= 15) {
        finalValue = 0.0;
      }

      difficulties.push({ value: finalValue, isA: false });
      updateLastDifficulty();
    }

    function markAsA() {
      if (difficulties.length === 0) return;

      let last = difficulties[difficulties.length - 1];
      last.isA = true;

      if (aCount >= 3) {
        last.value = 0.0;
      }

      aCount++;
      updateLastDifficulty();
    }

    function undoLast() {
      if (difficulties.length === 0) return;

      let last = difficulties.pop();
      if (last.isA) aCount--;

      updateLastDifficulty();
    }

    function validateScore() {
      let total = difficulties.reduce((sum, d) => sum + d.value, 0);

      modalTotal.textContent = total.toFixed(1);
      modalScore.textContent = total.toFixed(1);
      modalScoreBig.textContent = total.toFixed(1);

      modalBackdrop.classList.add("visible");
    }

    diffButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        addDifficulty(parseFloat(btn.dataset.value));
      });
    });

    undoButton.addEventListener("click", undoLast);
    markAButton.addEventListener("click", markAsA);
    validateButton.addEventListener("click", validateScore);

    restartButton.addEventListener("click", () => {
      difficulties = [];
      aCount = 0;
      updateLastDifficulty();
      modalBackdrop.classList.remove("visible");
    });
  </script>
</body>
</html>

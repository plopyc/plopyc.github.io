<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RG Execution Judging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-title">RG – Execution (E)</div>
      <div class="header-badge">
        <span>Panel</span>
        <strong>E1</strong>
      </div>
    </header>

    <main class="main-grid">
      <!-- Left column: deductions -->
      <section class="side-column">
        <div class="card">
          <div class="card-title">Deductions</div>
          <div class="value-grid">
            <button class="value-btn" data-ded="0.1">0.1</button>
            <button class="value-btn" data-ded="0.3">0.3</button>
            <button class="value-btn" data-ded="0.5">0.5</button>
            <button class="value-btn" data-ded="0.7">0.7</button>
            <button class="value-btn" data-ded="1.0">1.0</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Actions</div>
          <button class="btn btn-danger" id="exe-undo">Undo</button>
          <button class="btn" id="exe-reset">Reset</button>
        </div>
      </section>

      <!-- Center panel: total penalty / score -->
      <section class="center-panel">
        <div class="center-header">
          <div>
            <div class="center-label">Total penalty</div>
            <div id="exe-penalty" class="center-score">0.00</div>
          </div>
          <div>
            <div class="center-label">E1 (score)</div>
            <div id="exe-score" style="font-size:1.2rem;">10.00</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Last deduction</div>
          <div id="exe-current">No deduction applied</div>
        </div>

        <div class="center-footer">
          <button class="btn" onclick="openModal('exe-modal')">Insert</button>
          <button class="btn-main" id="exe-send">Send</button>
        </div>
      </section>

      <!-- Right column: history -->
      <section class="side-column">
        <div class="card">
          <div class="card-title">History</div>
          <div id="exe-history" class="history-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-item">Base score: 10.00</div>
      <div class="footer-item">Total penalty · E1 score · Panel E1</div>
    </footer>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="exe-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Confirm insertion</div>
        <button class="btn btn-pill btn-danger" onclick="closeModal('exe-modal')">×</button>
      </div>
      <div class="modal-body">
        Insert current penalty into the final E1 score?
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('exe-modal')">Cancel</button>
        <button class="btn-main" id="exe-confirm">Insert</button>
      </div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script src="scripts/exe.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RG - Execution Judging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body class="page-exec">
  <main class="app-shell execution-shell">
    <section class="execution-layout">
      <div class="side-stack">
        <button class="btn btn-side btn-red" id="btn-undo" type="button" disabled>Undo</button>
        <button class="btn btn-side btn-turquoise" type="button" data-value="0.1">0.1</button>
        <button class="btn btn-side btn-green" type="button" data-value="0.3">0.3</button>
      </div>

      <section class="center-panel execution-panel">
        <div class="center-header">
          <div class="center-label">Total penalty</div>
          <div class="center-score" id="total-penalty">0.0</div>
          <div class="center-last-row">E1 (score)</div>
          <div class="score-row" id="execution-score">10.0</div>
        </div>
        <div class="center-footer"><button class="btn-main" id="btn-validate" type="button">Validate</button></div>
      </section>

      <div class="side-stack">
        <button class="btn btn-side btn-yellow" type="button" data-value="0.5">0.5</button>
        <button class="btn btn-side btn-purple" type="button" data-value="0.7">0.7</button>
        <button class="btn btn-side btn-red" type="button" data-value="1.0">1.0</button>
      </div>

      <footer class="footer history-bar execution-history" id="history"></footer>
    </section>
  </main>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="execution-result-title">
    <section class="modal">
      <h1 class="modal-title" id="execution-result-title">Final Result</h1>
      <p id="modal-total">Total Penalty: 0.0</p>
      <p id="modal-score">Execution Score: 10.0</p>
      <button class="btn-restart" id="btn-restart" type="button">Restart</button>
    </section>
  </div>

  <script src="scripts/common.js" defer></script>
  <script src="scripts/exe.js" defer></script>
</body>
</html>
